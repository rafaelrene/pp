services:
  web:
    build:
      context: .
    image: pp:local
    restart: unless-stopped
    init: true
    env_file: .env.production
    ports:
      # Keep the loopback default; set PP_BIND_ADDRESS when proxying from another host.
      - '${PP_BIND_ADDRESS:-127.0.0.1}:3000:3000'
    volumes:
      - pp-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  pp-data:
